name: Watch CIM bib board

# GitHub drops most frequent cron triggers, so each run polls in a loop for
# ~5h45m instead. The hourly cron only restarts the loop; the concurrency group
# queues at most one waiting run, so coverage stays continuous.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Poll board every 3 minutes
        env:
          STATE_FILE: state/seen.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "cim-bib-watch"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python3 -I watch.py || echo "check failed, retrying next loop"
            git add state/seen.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Update seen comments"
              git pull -q --rebase && git push -q || echo "push failed, retrying next loop"
            fi
            sleep 180
          done
