name: Watch CIM bib board

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check board for new offers
        env:
          STATE_FILE: state/seen.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -I watch.py
      - name: Save seen comments
        run: |
          git config user.name "cim-bib-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "Update seen comments" && git push)
